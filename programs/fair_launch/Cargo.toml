[package]
name = "fair_launch"
version = "0.1.0"
edition = "2021"
description = "Permissionless fee crank for a Meteora DBC fair launch"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "fair_launch"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
